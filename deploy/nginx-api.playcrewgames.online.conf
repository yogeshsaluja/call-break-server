server_tokens off;
limit_req_status 429;
limit_conn_status 429;

limit_req_zone $binary_remote_addr zone=callbreak_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=callbreak_ws_handshake:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=callbreak_purchase:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=callbreak_ws:10m;

server {
    listen 80;
    listen [::]:80;
    server_name api.playcrewgames.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.playcrewgames.online;

    ssl_certificate /etc/letsencrypt/live/api.playcrewgames.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.playcrewgames.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 16k;

    location = /ws {
        limit_req zone=callbreak_ws_handshake burst=6 nodelay;
        limit_conn callbreak_ws 5;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_send_timeout 30s;
    }

    location = /api/v1/payments/google-play/verify {
        limit_req zone=callbreak_purchase burst=2 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 10s;
    }

    location /api/ {
        limit_req zone=callbreak_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 10s;
    }

    location = / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }
}
