name: Deploy CallBreak

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Oracle Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Oracle
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          script_stop: true

          script: |
            set -e

            echo "================================"
            echo "Deploying CallBreak"
            echo "================================"

            cd /opt/callbreak-server

            export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-arm64
            export PATH="$JAVA_HOME/bin:$PATH"

            echo "Preserving local build artifacts..."
            if ! git diff --quiet || ! git diff --cached --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
              git stash push --include-untracked --message "pre-deploy-${{ github.sha }}"
            fi

            echo "Pulling latest code..."
            git pull --ff-only origin main

            echo "Building CallBreak..."
            java -version
            ./gradlew clean :server:installDist

            echo "Installing hardened service and proxy configuration..."
            sudo install -d -o callbreak -g callbreak -m 0700 /opt/callbreak-server/data
            sudo install -m 0644 deploy/callbreak.service /etc/systemd/system/callbreak.service
            sudo install -m 0644 deploy/nginx-api.playcrewgames.online.conf \
              /etc/nginx/sites-available/api.playcrewgames.online
            sudo ln -sfn /etc/nginx/sites-available/api.playcrewgames.online \
              /etc/nginx/sites-enabled/api.playcrewgames.online
            sudo systemctl daemon-reload
            sudo nginx -t
            sudo systemctl reload nginx

            echo "Restarting CallBreak..."
            sudo systemctl restart callbreak

            echo "Waiting for application..."
            sleep 5

            echo "Checking service..."
            sudo systemctl is-active --quiet callbreak

            echo "Checking application..."
            curl --fail http://127.0.0.1:8081/

            echo "================================"
            echo "Deployment Successful!"
            echo "================================"
