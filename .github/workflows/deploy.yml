name: Deploy CallBreak

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Oracle Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Oracle
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          script_stop: true

          script: |
            set -euo pipefail

            echo "================================"
            echo "Deploying CallBreak"
            echo "================================"

            cd /opt/callbreak-server

            export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-arm64
            export PATH="$JAVA_HOME/bin:$PATH"

            grep -qxF '/data/' .git/info/exclude || printf '%s\n' '/data/' >> .git/info/exclude

            echo "Preserving local server changes..."
            if ! git diff --quiet || ! git diff --cached --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
              git stash push --include-untracked --message "pre-deploy-${{ github.sha }}"
            fi

            echo "Pulling latest code..."
            git pull --ff-only origin main

            RELEASE_ID="${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
            BUILD_DIR="/tmp/callbreak-build-$RELEASE_ID"
            RELEASE_DIR="/opt/callbreak-server/releases/$RELEASE_ID"

            echo "Building CallBreak in staging..."
            java -version
            mkdir -p "$BUILD_DIR"
            git archive --format=tar HEAD | tar -xf - -C "$BUILD_DIR"
            cd "$BUILD_DIR"
            ./gradlew :server:installDist

            echo "Installing release $RELEASE_ID..."
            sudo install -d -o root -g root -m 0755 /opt/callbreak-server/releases
            sudo install -d -o root -g root -m 0755 "$RELEASE_DIR"
            sudo cp -a server/build/install/server/. "$RELEASE_DIR/"
            sudo ln -sfn "$RELEASE_DIR" /opt/callbreak-server/current

            cd /opt/callbreak-server

            echo "Installing hardened service and proxy configuration..."
            sudo install -d -o callbreak -g callbreak -m 0700 /opt/callbreak-server/data
            sudo install -m 0644 deploy/callbreak.service /etc/systemd/system/callbreak.service
            sudo install -m 0644 deploy/nginx-api.playcrewgames.online.conf \
              /etc/nginx/sites-available/playcrew
            if [ -L /etc/nginx/sites-enabled/api.playcrewgames.online ]; then
              sudo unlink /etc/nginx/sites-enabled/api.playcrewgames.online
            fi
            sudo ln -sfn /etc/nginx/sites-available/playcrew \
              /etc/nginx/sites-enabled/playcrew
            sudo systemctl daemon-reload
            sudo nginx -t
            sudo systemctl reload nginx

            echo "Restarting CallBreak..."
            sudo systemctl restart callbreak

            echo "Waiting for application..."
            sleep 5

            echo "Checking service..."
            sudo systemctl is-active --quiet callbreak

            echo "Checking application..."
            curl --fail http://127.0.0.1:8081/

            rm -rf "$BUILD_DIR"

            echo "================================"
            echo "Deployment Successful!"
            echo "================================"
